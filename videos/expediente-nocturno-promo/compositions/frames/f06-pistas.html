<script>
(function(){
const tl = gsap.timeline({ paused: true });
const Q = s => document.querySelectorAll('[data-composition-id="f06-pistas"] ' + s);
const type = (sel, at, step) => { Q(sel + ' span').forEach((el, i) => tl.fromTo(el, {opacity:0}, {opacity:1, duration:0.01}, at + i*step)); };
const slam = (sel, at, from) => tl.fromTo(sel, {opacity:0, scale: from||1.35, filter:'blur(10px)'}, {opacity:1, scale:1, filter:'blur(0px)', duration:0.42, ease:'expo.out'}, at);
const rise = (sel, at) => tl.fromTo(sel, {opacity:0, y:40}, {opacity:1, y:0, duration:0.5, ease:'power3.out'}, at);
const flash = (sel, at, peak) => { tl.fromTo(sel, {opacity:0}, {opacity: peak||0.95, duration:0.05, ease:'none'}, at); tl.to(sel, {opacity:0, duration:0.55, ease:'power2.out'}, at+0.07); };
const push = (sel, d, a, b) => tl.fromTo(sel, {scale:a||1.0}, {scale:b||1.08, duration:d, ease:'none'}, 0);
const fall = (sel, d) => { Q(sel + ' i').forEach((el, i) => { const sp = 1800 + (i*137 % 900); tl.fromTo(el, {y: -300 - (i*211 % 1700)}, {y: -300 - (i*211 % 1700) + sp*d, duration:d, ease:'none'}, 0); }); };

push('#f06-pistas-vw1', 2.1, 1.0, 1.05);
tl.fromTo('#f06-pistas-vw2', {scale:1.04}, {scale:1.1, duration:2.20, ease:'none'}, 2.1);
tl.fromTo('#f06-pistas-band1', {opacity:0}, {opacity:1, duration:.3}, 0.1);
slam('#f06-pistas-l1', 0.25, 1.3);
tl.to(['#f06-pistas-band1','#f06-pistas-l1'], {opacity:0, duration:.01}, 2.1);
flash('#f06-pistas-flash', 2.1, .55);
tl.fromTo('#f06-pistas-top', {opacity:0}, {opacity:1, duration:.2}, 2.1);
tl.fromTo('#f06-pistas-glow', {opacity:0}, {opacity:1, duration:.4}, 2.15);
slam('#f06-pistas-clock', 2.15, 1.4);
const clk = {m:180}; const clockEl = Q('#f06-pistas-clock')[0];
tl.fromTo(clk, {m:180}, {m:359, duration:1.75, ease:'power2.in', onUpdate:()=>{ const m=Math.round(clk.m); clockEl.textContent=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }}, 2.4);
rise('#f06-pistas-l2', 2.6);

window.__timelines["f06-pistas"] = tl;
})();
